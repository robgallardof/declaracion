[project]
name = "declara-mx"
version = "0.1.0"
description = "Asistente de impuestos personales en México como servidor MCP: carpetas por mes, CFDI, cálculos RESICO/IVA/recargos, vencimientos y resumen de acuses."
requires-python = ">=3.12,<3.14"
dependencies = ["mcp[cli]>=1.30,<2", "pyyaml>=6", "pypdf>=4"]

[project.scripts]
declara = "declara_mx.cli:main"
declara-mx-mcp = "declara_mx.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/declara_mx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
