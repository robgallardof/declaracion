# declara-mx por Streamable HTTP con token. stdio no necesita compose (ver README).
# Uso: DECLARA_MCP_TOKEN=<token> docker compose up -d --build --wait
services:
  declara-mx:
    build: .
    image: declara-mx:local
    user: ${DECLARA_USER:-10001:10001}
    init: true
    command: ["--http", "--listen", "0.0.0.0:8080"]
    environment:
      DECLARA_MCP_TOKEN: ${DECLARA_MCP_TOKEN:?Define DECLARA_MCP_TOKEN con un token aleatorio de al menos 32 caracteres}
    ports:
      - "${DECLARA_BIND_ADDRESS:-127.0.0.1}:${DECLARA_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${DECLARA_WORKSPACE:-.}
        target: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
